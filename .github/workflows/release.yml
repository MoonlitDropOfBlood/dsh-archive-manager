name: Release 1.0

# 打 v* 标签（如 v1.0.0）时构建插件包并发布为 GitHub Release。
# 发布需要仓库 secret：GH_TOKEN（GitHub Personal Access Token，需 contents:write 权限）。
# 也支持手动触发（workflow_dispatch）构建产物但不发布正式 Release（仅 artifact）。
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Package plugin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci || npm install

      - name: Syntax check
        run: |
          node --check index.js
          node --check client.js
          node --check typert.host.js

      - name: Package tarball
        run: npm pack
        env:
          npm_config_package_lock: "false"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: package-tarball
          path: ./*.tgz

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -la artifacts/

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ## 1.1.0 — 跨平台支持：移除 Windows 专属实现

            ### 🖥 跨平台
            - **Host 半全面去 PowerShell 化**：`delete` 与 `state` 此前通过 `shell` 服务拼 PowerShell 命令（`Remove-Item` / `Test-Path`）删除会话日志、探测路径，仅在 Windows 可用。现改为直接使用 `node:fs`（`rm(recursive, force)` + `existsSync`），Windows / macOS / Linux 行为一致。
            - 移除 `shell`、`sandboxPolicy` 两个服务依赖：composition 插件运行于 DSH 主进程内、自带完整 Node 权限，无需 shell 提权绕沙箱。
            - `rm` 带 `maxRetries` / `retryDelay`，吸收 Windows 上杀软 / 索引器造成的瞬时文件锁。
            - Remote 协议（`restore` / `delete` / `state` 出入参）零改动，Client 半与 Typert manifest 不受影响。

            ### ✅ 验证
            - `node --check` 三个插件文件通过；新增 `scripts/smoke-fs.test.mjs` 独立冒烟测试（7/7 PASS）。
            - 构造函数 / Remote 标记校验通过；本地 profile 已安装最新副本并核对一致。

            ### 📦 安装
            ```bash
            git clone git@github.com:MoonlitDropOfBlood/dsh-archive-manager.git
            cd dsh-archive-manager
            node scripts/install.mjs
            # 重启 DSH 后，侧栏底部出现「归档」按钮
            ```
          files: artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
