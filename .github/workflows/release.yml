name: Release 1.0

# 打 v* 标签（如 v1.0.0）时构建插件包并发布为 GitHub Release。
# 发布凭证：优先用仓库 secret GH_TOKEN（PAT，contents:write），缺省回退内置
# GITHUB_TOKEN（工作流已声明 permissions: contents: write）。
# 也支持手动触发（workflow_dispatch）构建产物但不发布正式 Release（仅 artifact）。
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Package plugin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci || npm install

      - name: Syntax check
        run: |
          node --check index.js
          node --check client.js
          node --check typert.host.js

      - name: Package tarball
        run: npm pack
        env:
          npm_config_package_lock: "false"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: package-tarball
          path: ./*.tgz

  publish-npm:
    # npm OIDC Trusted Publishing (no static token / no OTP). Requires npm
    # CLI >= 11.5.1 and Node >= 22.14 (Node 24 bundles npm 11). Configure the
    # trusted publisher on npmjs.com for this package first (repo
    # MoonlitDropOfBlood/dsh-archive-manager + .github/workflows/release.yml),
    # then every v* tag push publishes to npm automatically.
    name: Publish to npm (Trusted Publishing)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm install
      - run: npm publish

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -la artifacts/

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ## ${{ github.ref_name }} — 兼容 DSH 0.2.0

            ### 🐛 修复
            - **DSH 0.2.x 上插件不再被静默跳过**：0.2.0 起 DSH 会校验插件声明的 `@deepseek-ai/dsh*` peer 版本范围，不匹配就整包不挂载（控制台只有一行 `skipping profile bundle ...`）。现在同时支持 0.1.x 与 0.2.x。
            - **永久删除真正删干净**：0.2.0 的 `sessionPersistence.locate()` 返回的是日志*文件*而非会话*目录*，旧逻辑只删掉当前那一份日志、留下旧格式代次，重启后会话复活。现在统一删除整个会话目录。

            ### 📦 安装（标准 DSH bundle）
            ```bash
            dsh plugin --profile web add https://github.com/MoonlitDropOfBlood/dsh-archive-manager/releases/download/v1.5.0/duke-dsh-plugins-dsh-archive-manager-1.5.0.tgz
            # 重启 DSH 后生效
            ```
          files: artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
