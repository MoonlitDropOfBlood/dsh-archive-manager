name: Release 1.0

# 打 v* 标签（如 v1.0.0）时构建插件包并发布为 GitHub Release。
# 发布凭证：优先用仓库 secret GH_TOKEN（PAT，contents:write），缺省回退内置
# GITHUB_TOKEN（工作流已声明 permissions: contents: write）。
# 也支持手动触发（workflow_dispatch）构建产物但不发布正式 Release（仅 artifact）。
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Package plugin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci || npm install

      - name: Syntax check
        run: |
          node --check index.js
          node --check client.js
          node --check typert.host.js

      - name: Package tarball
        run: npm pack
        env:
          npm_config_package_lock: "false"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: package-tarball
          path: ./*.tgz

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -la artifacts/

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ## ${{ github.ref_name }} — 标准 DSH bundle 安装

            ### 🏗 标准 DSH bundle
            - 迁移到官方 `dsh plugin` 安装机制：`package.json` 声明 `dsh.bundle.patch`，包内 `cordis.patch.yml` 提供挂载行；`dsh plugin add` 自动把包加入 `dsh.profile.bundles`。
            - 移除 `scripts/install.mjs`（复制包 + 手改 patch 的旧方式），卸载/更新走 `dsh plugin remove` / 重新 `add`。
            - 安装流程：`dsh plugin --profile web add <本地路径或 tarball URL>`；本地路径为 `link:` 软链，改代码即生效。

            ### 📦 安装（标准 DSH bundle）
            ```bash
            dsh plugin --profile web add https://github.com/MoonlitDropOfBlood/dsh-archive-manager/releases/download/v1.2.0/dsh-archive-manager-1.2.0.tgz
            # 重启 DSH 后，侧栏底部出现「归档」按钮
            ```
          files: artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
