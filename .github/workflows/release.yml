name: Release 1.0

# 打 v* 标签（如 v1.0.0）时构建插件包并发布为 GitHub Release。
# 发布凭证：优先用仓库 secret GH_TOKEN（PAT，contents:write），缺省回退内置
# GITHUB_TOKEN（工作流已声明 permissions: contents: write）。
# 也支持手动触发（workflow_dispatch）构建产物但不发布正式 Release（仅 artifact）。
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Package plugin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci || npm install

      - name: Syntax check
        run: |
          node --check index.js
          node --check client.js
          node --check typert.host.js

      - name: Package tarball
        run: npm pack
        env:
          npm_config_package_lock: "false"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: package-tarball
          path: ./*.tgz

  publish-npm:
    # npm OIDC Trusted Publishing (no static token / no OTP). Requires npm
    # CLI >= 11.5.1 and Node >= 22.14 (Node 24 bundles npm 11). Configure the
    # trusted publisher on npmjs.com for this package first (repo
    # MoonlitDropOfBlood/dsh-archive-manager + .github/workflows/release.yml),
    # then every v* tag push publishes to npm automatically.
    name: Publish to npm (Trusted Publishing)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm install
      - run: npm publish

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -la artifacts/

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ## ${{ github.ref_name }} — 修复「删除会话必须重启 dsh」

            ### 🐛 修复（#2）
            - **点「永久删除」没反应、必须重启 DSH 后再删一次**：客户端把 `remote.*()` 的返回值当成业务结果用，但 DSH 的 client connection 外面还包了一层 RPC 信封，实际拿到的是**双层** `{ ok:true, value:{ ok:true, value:{…} } }`。旧代码只判外层 `res.ok`（传输成功永远为 true），于是：
              - `delete()` 的 `res.value.live` 恒为 `undefined` → 确认框静默关闭，用户以为失败；
              - `state()` 的 `res.value.ghostIds` 恒为 `undefined` → ghost 行不隐藏，删除按钮继续显示；
              - `agent-running` / `delete-failed` / `locate-unavailable` 等业务失败原因全部被吞掉。
              新增 `unwrapRemoteResult()` 只在内层对象自带 boolean `ok` 时剥壳，业务 payload 原样返回；`state` / `delete` / 旧面板 `restore|delete` 三处统一走它。
            - **live 会话定位**：`sessions.get(id)` 非空时直接用活会话自身 header（不再全量扫描语料）；非 live 才走 `findHeader()`。
            - **`sessionPersistence.list()` 快照解析**：DSH ≥ 0.1.7 返回 `{ header, formatStatus }` 快照，旧回退按裸 header 查找永远落空，已兼容两种形状。
            - **Windows 瞬时文件锁**：`rm` 重试提升到 5 次 / 250ms。
            - **归档集合自愈**：ghost 条目在重启后由 `state()` 触发每进程一次的清理（列举失败则整批保留，不猜删）。
            - 删除确认框的 ghost 文案改为「侧栏条目会在重启 DSH 后消失（无需再次删除）」。

            ### 🧪 测试
            - `verify-client-apply.mjs` 新增信封剥离单测（单层/双层/裸 payload/业务失败/网关失败/nullish），fake remote 改为真实双层线形。
            - `verify-real-install.mjs` 新增 4 条用例：live 会话自身 header + 保留 ghost 条目、`{ header }` 快照解析、stale 条目清理、列举失败不清理。
            - 真机 headless 客户端实测：修复前 ghost 行仍显示 🗑；修复后该行删除入口消失。

            ### 📦 安装（标准 DSH bundle）
            ```bash
            dsh plugin --profile web add https://github.com/MoonlitDropOfBlood/dsh-archive-manager/releases/download/${{ github.ref_name }}/duke-dsh-plugins-dsh-archive-manager-1.5.4.tgz
            # 重启 DSH 后生效
            ```
            > 注意：npm 包名带 scope，`npm pack` 产物文件名是 `duke-dsh-plugins-dsh-archive-manager-1.5.4.tgz`（不带 `v`），若链接 404 请以 Release 附件实际文件名为准。
          files: artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
