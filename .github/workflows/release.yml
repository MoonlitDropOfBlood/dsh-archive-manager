name: Release 1.0

# 打 v* 标签（如 v1.0.0）时构建插件包并发布为 GitHub Release。
# 发布凭证：优先用仓库 secret GH_TOKEN（PAT，contents:write），缺省回退内置
# GITHUB_TOKEN（工作流已声明 permissions: contents: write）。
# 也支持手动触发（workflow_dispatch）构建产物但不发布正式 Release（仅 artifact）。
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Package plugin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci || npm install

      - name: Syntax check
        run: |
          node --check index.js
          node --check client.js
          node --check typert.host.js

      - name: Package tarball
        run: npm pack
        env:
          npm_config_package_lock: "false"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: package-tarball
          path: ./*.tgz

  publish-npm:
    # npm OIDC Trusted Publishing (no static token / no OTP). Requires npm
    # CLI >= 11.5.1 and Node >= 22.14 (Node 24 bundles npm 11). Configure the
    # trusted publisher on npmjs.com for this package first (repo
    # MoonlitDropOfBlood/dsh-archive-manager + .github/workflows/release.yml),
    # then every v* tag push publishes to npm automatically.
    name: Publish to npm (Trusted Publishing)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm install
      - run: npm publish

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -la artifacts/

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ## ${{ github.ref_name }} — 修复暗色主题下「永久删除」按钮文字不可见

            ### 🐛 修复
            - **暗色主题下「永久删除」按钮文字不可见**（红底 + 深色字）：删除确认框的 danger 按钮把字色写成了 `var(--dsw-alias-bg-base, #fff)`——那是**页面背景色**令牌，浅色主题下恰好是白色所以看不出来，暗色主题下是 `rgb(21,21,23)`（近黑），红底黑字完全不可读；壁纸类插件还会把它改写成 `transparent`，变成纯红块无字。现在改用宿主语义正确的反色令牌 `--dsw-alias-label-on-color`（深浅主题恒为 `rgb(255,255,255)`，且不受壁纸插件改写影响），hover 规则也显式锁死同一字色（hover 的 `filter:brightness(1.06)` 会把红底变亮）。
            - 相关注释补齐前提条件：弹窗层级结论「侧栏列不构成 stacking context」只在默认（非 drawer）布局成立——drawer 模式下宿主把 `.sidebarCol` 变成 `position:absolute; z-index:71`，自成层叠上下文。仅修正注释措辞，未改动 `.am-overlay` 的 z-index。

            ### 🧪 测试
            - 新增 `verify-client-theme-tokens.mjs` 静态守卫：`.am-confirm-danger` 规则不得出现 `var(--dsw-alias-bg-base`，且必须使用 `--dsw-alias-label-on-color`（已串入 `npm run verify`）。

            ### 📦 安装（标准 DSH bundle）
            ```bash
            dsh plugin --profile web add https://github.com/MoonlitDropOfBlood/dsh-archive-manager/releases/download/v1.5.3/duke-dsh-plugins-dsh-archive-manager-1.5.3.tgz
            # 重启 DSH 后生效
            ```
          files: artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
