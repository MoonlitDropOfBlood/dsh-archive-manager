name: Release 1.0

# 打 v* 标签（如 v1.0.0）时构建插件包并发布为 GitHub Release。
# 发布凭证：优先用仓库 secret GH_TOKEN（PAT，contents:write），缺省回退内置
# GITHUB_TOKEN（工作流已声明 permissions: contents: write）。
# 也支持手动触发（workflow_dispatch）构建产物但不发布正式 Release（仅 artifact）。
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Package plugin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci || npm install

      - name: Syntax check
        run: |
          node --check index.js
          node --check client.js
          node --check typert.host.js

      - name: Package tarball
        run: npm pack
        env:
          npm_config_package_lock: "false"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: package-tarball
          path: ./*.tgz

  publish-npm:
    # npm OIDC Trusted Publishing (no static token / no OTP). Requires npm
    # CLI >= 11.5.1 and Node >= 22.14 (Node 24 bundles npm 11). Configure the
    # trusted publisher on npmjs.com for this package first (repo
    # MoonlitDropOfBlood/dsh-archive-manager + .github/workflows/release.yml),
    # then every v* tag push publishes to npm automatically.
    name: Publish to npm (Trusted Publishing)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm install
      - run: npm publish

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -la artifacts/

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ## ${{ github.ref_name }} — 删除会话后侧栏行立即消失

            ### 🐛 修复
            - **永久删除后会话仍留在侧栏**：DSH 的会话列表是 live-preferred——删掉日志文件并不会销毁宿主内存里的 Session 对象，`session/list` 仍会把它合并进列表，所以「仅显示已归档」视图会一直显示该行直到重启。
              - **0.2.x**：删除成功后先结算在途的 `session/list` 拉取，再调用客户端 `sessions.handleSessionRemoved(id)`（shell 处理 `api-session/removed` 的同一入口）立即把行从浏览器会话目录移除；分组、空态同步正确。
              - **0.1.x（无该入口）**：按 ghost id 注入 `[data-row-key="session:<id>"]{display:none}` CSS 兜底。
              - `sessions.list` 每次变化重扫 ghost 集合，reconnect 重新拉取也不会让行复活。
            - ghost 确认框文案改为「侧栏条目已移除，重启 DSH 后彻底清除」。

            ### 🧪 测试
            - `verify-client-apply.mjs` 新增 ghost 行 CSS 生成、`refresh()` 先于目录移除、目录移除幂等、无入口兜底等断言；`npm run verify` 全绿。
            - 真实 DSH 0.2.2-rc.5 + headless 客户端实测：archived-only 视图里已删除的 ghost 行不再出现在 DOM（不是仅靠 CSS 隐藏）。

            ### 📦 安装（标准 DSH bundle）
            ```bash
            dsh plugin --profile web add https://github.com/MoonlitDropOfBlood/dsh-archive-manager/releases/download/${{ github.ref_name }}/duke-dsh-plugins-dsh-archive-manager-1.5.5.tgz
            # 重启 DSH 后生效
            ```
            > 注意：npm 包名带 scope，`npm pack` 产物文件名是 `duke-dsh-plugins-dsh-archive-manager-1.5.5.tgz`（不带 `v`），若链接 404 请以 Release 附件实际文件名为准。
          files: artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
